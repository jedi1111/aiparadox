document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

6D8;\n    --ink: #15110C;\n    --ink-2: #2C2722;\n    --muted: #6B6256;\n    --rule: #1511101A;\n    --rule-strong: #15111033;\n    --vermilion: #C04222;\n    --vermilion-soft: #C0422214;\n    --teal: #0F4C46;\n    --teal-soft: #0F4C4614;\n    --gold: #B6892C;\n\n    --serif: \"Spectral\", \"Iowan Old Style\", Georgia, serif;\n    --display: \"Space Grotesk\", \"Helvetica Neue\", system-ui, sans-serif;\n    --mono: \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  html { scroll-behavior: smooth; }\n  body {\n    background: var(--paper);\n    color: var(--ink);\n    font-family: var(--serif);\n    font-size: 19px;\n    line-height: 1.6;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    overflow-x: hidden;\n  }\n  ::selection { background: var(--vermilion); color: var(--paper); }\n\n  /* ─── Layout primitives ─────────────────────────── */\n  .container {\n    max-width: 1240px;\n    margin: 0 auto;\n    padding: 0 48px;\n  }\n  .narrow {\n    max-width: 720px;\n    margin: 0 auto;\n  }\n  .wide {\n    max-width: 1080px;\n    margin: 0 auto;\n  }\n\n  /* ─── Top chrome ─────────────────────────── */\n  .topbar {\n    position: fixed;\n    top: 0; left: 0; right: 0;\n    height: 56px;\n    background: color-mix(in oklab, var(--paper) 88%, transparent);\n    backdrop-filter: blur(12px);\n    -webkit-backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--rule);\n    z-index: 100;\n    display: flex;\n    align-items: center;\n    padding: 0 28px;\n    font-family: var(--display);\n    font-size: 13px;\n    letter-spacing: 0.02em;\n  }\n  .topbar .brand {\n    font-weight: 600;\n    color: var(--ink);\n  }\n  .topbar .brand .dot {\n    display: inline-block;\n    width: 7px; height: 7px;\n    border-radius: 50%;\n    background: var(--vermilion);\n    margin-right: 10px;\n    transform: translateY(-2px);\n  }\n  .topbar .meta {\n    margin-left: auto;\n    color: var(--muted);\n    font-family: var(--mono);\n    font-size: 11px;\n  }\n  .progress-bar {\n    position: absolute;\n    bottom: -1px; left: 0;\n    height: 2px;\n    background: var(--vermilion);\n    width: 0%;\n    transition: width 60ms linear;\n  }\n\n  /* ─── Hero ─────────────────────────── */\n  .hero {\n    min-height: 100vh;\n    padding: 140px 0 80px;\n    position: relative;\n    border-bottom: 1px solid var(--rule);\n  }\n  .hero .eyebrow {\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--vermilion);\n    margin-bottom: 36px;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n  }\n  .hero .eyebrow::before,\n  .hero .eyebrow::after {\n    content: \"\";\n    flex: 0 0 28px;\n    height: 1px;\n    background: var(--vermilion);\n    opacity: 0.6;\n  }\n  .hero .eyebrow::after { flex: 1; }\n  .hero h1 {\n    font-family: var(--serif);\n    font-weight: 400;\n    font-size: clamp(56px, 9vw, 132px);\n    line-height: 0.96;\n    letter-spacing: -0.025em;\n    margin: 0 0 32px;\n    max-width: 14ch;\n  }\n  .hero h1 em {\n    font-style: italic;\n    color: var(--vermilion);\n  }\n  .hero .deck {\n    font-family: var(--serif);\n    font-size: 22px;\n    line-height: 1.5;\n    color: var(--ink-2);\n    max-width: 56ch;\n    margin: 0 0 64px;\n  }\n  .hero .byline {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 32px;\n    border-top: 1px solid var(--rule-strong);\n    padding-top: 24px;\n    max-width: 880px;\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.05em;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .hero .byline strong {\n    display: block;\n    color: var(--ink);\n    font-weight: 500;\n    margin-top: 6px;\n    font-family: var(--display);\n    font-size: 13px;\n    text-transform: none;\n    letter-spacing: 0;\n  }\n  .hero .scroll-cue {\n    position: absolute;\n    bottom: 36px;\n    left: 50%;\n    transform: translateX(-50%);\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--muted);\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 12px;\n    animation: pulse 2.4s ease-in-out infinite;\n  }\n  .scroll-cue .line {\n    width: 1px;\n    height: 36px;\n    background: linear-gradient(to bottom, transparent, var(--ink) 60%);\n  }\n  @keyframes pulse {\n    0%, 100% { opacity: 0.6; transform: translateX(-50%) translateY(0); }\n    50% { opacity: 1; transform: translateX(-50%) translateY(4px); }\n  }\n\n  /* ─── Section structure ─────────────────────────── */\n  section.chapter {\n    padding: 140px 0;\n    border-bottom: 1px solid var(--rule);\n    position: relative;\n  }\n  .chapter-head {\n    display: grid;\n    grid-template-columns: 120px 1fr;\n    gap: 48px;\n    margin-bottom: 80px;\n    align-items: start;\n  }\n  .chapter-num {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--muted);\n    padding-top: 18px;\n    border-top: 2px solid var(--ink);\n  }\n  .chapter-num strong {\n    display: block;\n    font-family: var(--display);\n    font-size: 13px;\n    color: var(--ink);\n    margin-top: 6px;\n    letter-spacing: 0.04em;\n  }\n  .chapter-title h2 {\n    font-family: var(--serif);\n    font-weight: 400;\n    font-size: clamp(40px, 5.4vw, 72px);\n    line-height: 1.02;\n    letter-spacing: -0.02em;\n    margin: 0 0 20px;\n    max-width: 16ch;\n  }\n  .chapter-title h2 em { font-style: italic; color: var(--vermilion); }\n  .chapter-title h2 .teal { color: var(--teal); font-style: italic; }\n  .chapter-title .standfirst {\n    font-family: var(--serif);\n    font-size: 21px;\n    line-height: 1.55;\n    color: var(--ink-2);\n    max-width: 52ch;\n  }\n\n  p.body {\n    max-width: 60ch;\n    margin: 0 0 1.2em;\n    font-size: 19px;\n    line-height: 1.65;\n    color: var(--ink-2);\n  }\n  p.body strong { color: var(--ink); font-weight: 500; }\n  p.body em { color: var(--vermilion); font-style: italic; }\n\n  .pull {\n    font-family: var(--serif);\n    font-size: 32px;\n    line-height: 1.25;\n    font-style: italic;\n    color: var(--ink);\n    border-left: 2px solid var(--vermilion);\n    padding: 8px 0 8px 28px;\n    max-width: 26ch;\n    margin: 56px 0;\n  }\n\n  /* ─── Reveal animation ─────────────────────────── */\n  .reveal {\n    opacity: 0;\n    transform: translateY(24px);\n    transition: opacity 0.9s ease-out, transform 0.9s ease-out;\n  }\n  .reveal.in {\n    opacity: 1;\n    transform: translateY(0);\n  }\n  .reveal.delay-1 { transition-delay: 0.1s; }\n  .reveal.delay-2 { transition-delay: 0.2s; }\n  .reveal.delay-3 { transition-delay: 0.35s; }\n  .reveal.delay-4 { transition-delay: 0.5s; }\n\n  /* ─── Chapter 1: The gap ─────────────────────────── */\n  .gap-figure {\n    margin: 80px 0 0;\n    background: var(--paper-2);\n    border: 1px solid var(--rule-strong);\n    padding: 48px 56px 40px;\n    position: relative;\n  }\n  .gap-figure .fig-label {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--muted);\n    margin-bottom: 8px;\n  }\n  .gap-figure .fig-title {\n    font-family: var(--display);\n    font-size: 22px;\n    font-weight: 500;\n    margin-bottom: 36px;\n    color: var(--ink);\n  }\n  .gap-figure svg { display: block; width: 100%; height: auto; }\n  .gap-figure .legend {\n    display: flex;\n    gap: 32px;\n    margin-top: 28px;\n    font-family: var(--mono);\n    font-size: 12px;\n    color: var(--ink-2);\n    border-top: 1px solid var(--rule);\n    padding-top: 20px;\n  }\n  .gap-figure .legend .swatch {\n    display: inline-block;\n    width: 22px; height: 2px;\n    margin-right: 10px;\n    transform: translateY(-4px);\n  }\n\n  /* ─── Friction stat grid ─────────────────────────── */\n  .friction-grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 1px;\n    margin: 80px 0;\n    background: var(--rule-strong);\n    border: 1px solid var(--rule-strong);\n  }\n  .friction-cell {\n    background: var(--paper);\n    padding: 44px 40px 40px;\n    position: relative;\n    transition: background 0.3s ease;\n  }\n  .friction-cell:hover { background: var(--paper-2); }\n  .friction-cell .tag {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--vermilion);\n    margin-bottom: 18px;\n  }\n  .friction-cell h3 {\n    font-family: var(--serif);\n    font-weight: 400;\n    font-size: 32px;\n    line-height: 1.15;\n    margin: 0 0 14px;\n    letter-spacing: -0.01em;\n  }\n  .friction-cell p {\n    font-family: var(--serif);\n    font-size: 17px;\n    line-height: 1.55;\n    color: var(--ink-2);\n    margin: 0;\n    max-width: 42ch;\n  }\n  .friction-cell .stat {\n    font-family: var(--display);\n    font-size: 56px;\n    font-weight: 500;\n    line-height: 1;\n    letter-spacing: -0.02em;\n    color: var(--ink);\n    margin-bottom: 12px;\n    display: flex;\n    align-items: baseline;\n    gap: 8px;\n  }\n  .friction-cell .stat .unit {\n    font-size: 24px;\n    color: var(--muted);\n    font-weight: 400;\n  }\n\n  /* Verification tax mini-viz */\n  .vtax {\n    margin: 64px 0 32px;\n    padding: 40px 0;\n    border-top: 1px solid var(--rule);\n    border-bottom: 1px solid var(--rule);\n  }\n  .vtax-bars {\n    display: grid;\n    grid-template-columns: 80px 1fr;\n    gap: 16px;\n    align-items: center;\n    margin-bottom: 14px;\n    font-family: var(--mono);\n    font-size: 12px;\n  }\n  .vtax-bars .label { color: var(--muted); text-align: right; }\n  .vtax-track {\n    height: 28px;\n    background: var(--paper-2);\n    border: 1px solid var(--rule);\n    position: relative;\n    display: flex;\n  }\n  .vtax-track .seg {\n    height: 100%;\n    transition: width 1.4s cubic-bezier(.2,.7,.2,1);\n    width: 0;\n    display: flex;\n    align-items: center;\n    padding: 0 10px;\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--paper);\n    overflow: hidden;\n    white-space: nowrap;\n  }\n  .vtax-track .seg.creation { background: var(--ink); }\n  .vtax-track .seg.verify { background: var(--vermilion); }\n  .vtax-track .seg.fix { background: var(--gold); color: var(--ink); }\n\n  /* ─── J-curve + SMB vs Enterprise ─────────────────────────── */\n  .jcurve-figure {\n    margin: 80px 0 0;\n    background: var(--paper-2);\n    border: 1px solid var(--rule-strong);\n    padding: 48px 56px 40px;\n  }\n  .jcurve-figure .fig-label {\n    font-family: var(--mono); font-size: 11px;\n    letter-spacing: 0.12em; text-transform: uppercase;\n    color: var(--muted); margin-bottom: 8px;\n  }\n  .jcurve-figure .fig-title {\n    font-family: var(--display); font-size: 22px; font-weight: 500;\n    margin-bottom: 36px;\n  }\n  .jcurve-figure svg { display: block; width: 100%; height: auto; }\n\n  .pilot-purgatory {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 56px;\n    align-items: center;\n    margin: 96px 0;\n  }\n  .pilot-purgatory .ratio-viz {\n    aspect-ratio: 1 / 1;\n    width: 100%;\n    max-width: 420px;\n    position: relative;\n  }\n  .pilot-purgatory .ratio-viz svg { display: block; width: 100%; height: 100%; }\n  .pilot-purgatory .ratio-text h3 {\n    font-family: var(--serif); font-weight: 400;\n    font-size: 56px; line-height: 1; margin: 0 0 16px;\n    letter-spacing: -0.02em;\n  }\n  .pilot-purgatory .ratio-text h3 em { color: var(--vermilion); font-style: italic; }\n  .pilot-purgatory .ratio-text p {\n    font-size: 19px; line-height: 1.6; color: var(--ink-2);\n    max-width: 36ch;\n  }\n\n  /* ─── Bolted vs Built toggle ─────────────────────────── */\n  .toggle-stage {\n    margin: 80px 0;\n  }\n  .toggle-control {\n    display: inline-flex;\n    background: var(--paper-2);\n    border: 1px solid var(--rule-strong);\n    padding: 4px;\n    margin-bottom: 32px;\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n  }\n  .toggle-control button {\n    background: transparent;\n    border: none;\n    padding: 12px 28px;\n    cursor: pointer;\n    color: var(--muted);\n    font-family: inherit;\n    font-size: inherit;\n    letter-spacing: inherit;\n    text-transform: inherit;\n    transition: all 0.3s ease;\n    font-weight: 500;\n  }\n  .toggle-control button.active {\n    background: var(--ink);\n    color: var(--paper);\n  }\n  .toggle-stage .stage-frame {\n    background: var(--paper-2);\n    border: 1px solid var(--rule-strong);\n    padding: 56px 56px 48px;\n  }\n  .toggle-stage .stage-head {\n    display: flex;\n    justify-content: space-between;\n    align-items: end;\n    margin-bottom: 36px;\n    border-bottom: 1px solid var(--rule);\n    padding-bottom: 24px;\n  }\n  .toggle-stage .stage-head .meta {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .toggle-stage .stage-head h3 {\n    font-family: var(--serif); font-weight: 400;\n    font-size: 44px; line-height: 1; margin: 0;\n    letter-spacing: -0.015em;\n    transition: color 0.5s ease;\n  }\n  .toggle-stage .stage-head h3 em { font-style: italic; }\n  .toggle-stage .stage-svg {\n    height: 460px;\n    position: relative;\n  }\n  .toggle-stage svg { display: block; width: 100%; height: 100%; }\n  .toggle-stage .annot {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 24px;\n    margin-top: 32px;\n    border-top: 1px solid var(--rule);\n    padding-top: 28px;\n  }\n  .toggle-stage .annot .item .k {\n    font-family: var(--mono); font-size: 11px;\n    letter-spacing: 0.12em; text-transform: uppercase;\n    color: var(--muted); margin-bottom: 6px;\n  }\n  .toggle-stage .annot .item .v {\n    font-family: var(--display); font-size: 22px;\n    font-weight: 500; color: var(--ink);\n    transition: color 0.5s ease;\n  }\n\n  /* Network nodes & edges */\n  .node circle { transition: all 0.8s cubic-bezier(.5,.2,.2,1); }\n  .node text {\n    font-family: var(--mono);\n    font-size: 10px;\n    fill: var(--ink);\n    text-anchor: middle;\n    dominant-baseline: middle;\n    letter-spacing: 0.05em;\n    text-transform: uppercase;\n  }\n  .edge {\n    stroke: var(--ink);\n    stroke-width: 1;\n    transition: all 0.8s cubic-bezier(.5,.2,.2,1);\n    fill: none;\n  }\n\n  /* ─── EPOCH ─────────────────────────── */\n  .epoch-stage {\n    margin: 80px 0;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 80px;\n    align-items: center;\n  }\n  .epoch-svg-wrap {\n    aspect-ratio: 1 / 1;\n    max-width: 520px;\n  }\n  .epoch-svg-wrap svg { display: block; width: 100%; height: 100%; }\n  .epoch-letters .letter-row {\n    display: grid;\n    grid-template-columns: 56px 1fr;\n    gap: 20px;\n    padding: 18px 0;\n    border-bottom: 1px solid var(--rule);\n    align-items: baseline;\n    cursor: pointer;\n    transition: padding 0.3s ease;\n  }\n  .epoch-letters .letter-row:hover { padding-left: 8px; }\n  .epoch-letters .letter-row.active { background: var(--vermilion-soft); padding-left: 12px; }\n  .epoch-letters .letter-row .L {\n    font-family: var(--serif);\n    font-size: 44px;\n    line-height: 1;\n    color: var(--vermilion);\n    font-style: italic;\n    font-weight: 400;\n  }\n  .epoch-letters .letter-row .name {\n    font-family: var(--display);\n    font-weight: 600;\n    font-size: 17px;\n    margin-bottom: 4px;\n  }\n  .epoch-letters .letter-row .desc {\n    font-family: var(--serif);\n    font-size: 15px;\n    color: var(--muted);\n    line-height: 1.5;\n  }\n\n  /* ─── Sarah's day timeline ─────────────────────────── */\n  .day-stage {\n    margin: 96px 0 64px;\n  }\n  .day-intro {\n    border-left: 2px rid;\n    grid-template-columns: 1fr 1fr;\n    gap: 0;\n    border: 1px solid var(--rule-strong);\n  }\n  .outcome-col {\n    padding: 48px 44px;\n  }\n  .outcome-col.old {\n    background: var(--paper);\n    border-right: 1px solid var(--rule-strong);\n  }\n  .outcome-col.new {\n    background: var(--ink);\n    color: var(--paper);\n  }\n  .outcome-col .header {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--muted);\n    margin-bottom: 20px;\n  }\n  .outcome-col.new .header { color: #b8a98c; }\n  .outcome-col h3 {\n    font-family: var(--serif);\n    font-weight: 400;\n    font-size: 36px;\n    line-height: 1.1;\n    margin: 0 0 28px;\n    letter-spacing: -0.015em;\n  }\n  .outcome-col h3 em { font-style: italic; color: var(--vermilion); }\n  .outcome-col.new h3 em { color: var(--gold); }\n  .outcome-col ul {\n    list-style: none;\n    padding: 0; margin: 0;\n  }\n  .outcome-col li {\n    font-family: var(--serif);\n    font-size: 18px;\n    padding: 14px 0;\n    border-top: 1px solid var(--rule);\n    display: flex;\n    align-items: baseline;\n    gap: 14px;\n  }\n  .outcome-col.new li { border-top-color: #ffffff1f; }\n  .outcome-col li::before {\n    content: \"—\";\n    color: var(--muted);\n    flex: 0 0 auto;\n  }\n  .outcome-col.new li::before { color: #b8a98c; }\n\n  /* ─── Closing ─────────────────────────── */\n  .closing {\n    padding: 160px 0 200px;\n    text-align: left;\n    border-bottom: 1px solid var(--rule);\n  }\n  .closing .punch {\n    font-family: var(--serif);\n    font-weight: 300;\n    font-size: clamp(40px, 5.4vw, 76px);\n    line-height: 1.08;\n    letter-spacing: -0.02em;\n    margin: 0 0 48px;\n    max-width: 22ch;\n  }\n  .closing .punch em { font-style: italic; color: var(--vermilion); }\n  .closing .signoff {\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--muted);\n    border-top: 1px solid var(--rule-strong);\n    padding-top: 24px;\n    max-width: 880px;\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 24px;\n  }\n  .closing .signoff strong {\n    display: block;\n    font-family: var(--display);\n    font-size: 14px;\n    color: var(--ink);\n    text-transform: none;\n    letter-spacing: 0;\n    margin-top: 6px;\n    font-weight: 500;\n  }\n\n  footer.foot {\n    padding: 40px 0;\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--muted);\n    letter-spacing: 0.04em;\n    display: flex;\n    justify-content: space-between;\n  }\n\n  @media (max-width: 900px) {\n    .container { padding: 0 24px; }\n    .chapter-head { grid-template-columns: 1fr; gap: 16px; }\n    .friction-grid { grid-template-columns: 1fr; }\n    .pilot-purgatory, .epoch-stage, .outcome-stage { grid-template-columns: 1fr; gap: 32px; }\n    .day-row { grid-template-columns: 80px 1fr; gap: 20px; }\n    .day-row .concept { grid-column: 1 / -1; }\n    .toggle-stage .stage-head { flex-direction: column; align-items: flex-start; gap: 12px; }\n    .toggle-stage .annot { grid-template-columns: 1fr; }\n    .closing .signoff { grid-template-columns: 1fr; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"topbar\">\n  <div class=\"brand\"><span class=\"dot\"><\u002Fspan>The AI Paradox<\u002Fdiv>\n  <div class=\"meta\">No. 01 · 2026 Reckoning<\u002Fdiv>\n  <div class=\"progress-bar\" id=\"progress\"><\u002Fdiv>\n<\u002Fheader>\n\n<!-- ───────────────────────────── HERO ───────────────────────────── -->\n<section class=\"hero\">\n  <div class=\"container\">\n    <div class=\"eyebrow reveal in\">An interactive essay · 11 minute read<\u002Fdiv>\n    <h1 class=\"reveal in delay-1\">The ghost of Solow, <em>redux.<\u002Fem><\u002Fh1>\n    <p class=\"deck reveal in delay-2\">In 2026, the global economy is pouring two hundred billion dollars into artificial intelligence. Aggregate productivity has not budged. This is the gap — and the story of why it persists, and how a small number of firms have already closed it.<\u002Fp>\n    <div class=\"byline reveal in delay-3\">\n      <div>Filed<strong>April 2026<\u002Fstrong><\u002Fdiv>\n      <div>Subject<strong>The Solow Paradox<\u002Fstrong><\u002Fdiv>\n      <div>Format<strong>Six chapters<\u002Fstrong><\u002Fdiv>\n      <div>Method<strong>Scroll to read<\u002Fstrong><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"scroll-cue\">\n    <span>Scroll<\u002Fspan>\n    <span class=\"line\"><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────────────────────────── CH 1 ───────────────────────────── -->\n<section class=\"chapter\" id=\"ch1\">\n  <div class=\"container\">\n    <div class=\"chapter-head\">\n      <div class=\"chapter-num reveal\">Chapter<strong>One<\u002Fstrong><\u002Fdiv>\n      <div class=\"chapter-title\">\n        <h2 class=\"reveal delay-1\">A spending boom <em>without<\u002Fem> the productivity boom.<\u002Fh2>\n        <p class=\"standfirst reveal delay-2\">Robert Solow's 1987 quip — \"you can see the computer age everywhere but in the productivity statistics\" — has a 2026 sequel. Two hundred billion dollars in AI infrastructure has not yet moved the needle on global GDP. The question is no longer whether AI works. It is why the economy doesn't.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">Every quarterly report tells the same story: capital expenditure on AI is climbing a near-vertical line. Pilot programs are everywhere. Earnings calls are saturated with the word. And yet, when economists check the macro data, output per worker remains stuck where it was before any of this began.<\u002Fp>\n      <p class=\"body reveal\">The pattern is so familiar it has a name. <strong>The Solow Paradox<\u002Fstrong> — the gap between technology adoption and measurable productivity — was first observed during the 1980s computer wave. It took roughly fifteen years for the productivity numbers to follow the spending. We are, by most accounts, in year three of the AI version.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"wide gap-figure reveal\" id=\"gap-figure\">\n      <div class=\"fig-label\">Figure 1.1 · Indexed, 2020 = 100<\u002Fdiv>\n      <div class=\"fig-title\">AI capital expenditure has decoupled from productivity.<\u002Fdiv>\n      <svg viewBox=\"0 0 900 380\" preserveAspectRatio=\"xMidYMid meet\" id=\"gap-svg\">\n        <!-- grid -->\n        <g stroke=\"var(--rule)\" stroke-width=\"1\">\n          <line x1=\"60\" y1=\"40\" x2=\"860\" y2=\"40\"><\u002Fline>\n          <line x1=\"60\" y1=\"110\" x2=\"860\" y2=\"110\"><\u002Fline>\n          <line x1=\"60\" y1=\"180\" x2=\"860\" y2=\"180\"><\u002Fline>\n          <line x1=\"60\" y1=\"250\" x2=\"860\" y2=\"250\"><\u002Fline>\n          <line x1=\"60\" y1=\"320\" x2=\"860\" y2=\"320\" stroke=\"var(--ink)\" stroke-width=\"1.2\"><\u002Fline>\n        <\u002Fg>\n        <!-- y labels -->\n        <g font-family=\"JetBrains Mono\" font-size=\"11\" fill=\"var(--muted)\">\n          <text x=\"50\" y=\"44\" text-anchor=\"end\">300<\u002Ftext>\n          <text x=\"50\" y=\"114\" text-anchor=\"end\">225<\u002Ftext>\n          <text x=\"50\" y=\"184\" text-anchor=\"end\">150<\u002Ftext>\n          <text x=\"50\" y=\"254\" text-anchor=\"end\">100<\u002Ftext>\n          <text x=\"50\" y=\"324\" text-anchor=\"end\">50<\u002Ftext>\n        <\u002Fg>\n        <!-- x labels -->\n        <g font-family=\"JetBrains Mono\" font-size=\"11\" fill=\"var(--muted)\">\n          <text x=\"60\" y=\"345\">2020<\u002Ftext>\n          <text x=\"220\" y=\"345\">2021<\u002Ftext>\n          <text x=\"380\" y=\"345\">2022<\u002Ftext>\n          <text x=\"540\" y=\"345\">2023<\u002Ftext>\n          <text x=\"700\" y=\"345\">2024<\u002Ftext>\n          <text x=\"860\" y=\"345\" text-anchor=\"end\">2025<\u002Ftext>\n        <\u002Fg>\n\n        <!-- Productivity (flat) -->\n        <path id=\"prod-line\" d=\"M 60 250 C 220 248, 380 252, 540 246 S 700 248, 860 244\" stroke=\"var(--ink)\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"2000\" stroke-dashoffset=\"2000\"><\u002Fpath>\n        <text id=\"prod-label\" x=\"852\" y=\"232\" font-family=\"Space Grotesk\" font-size=\"13\" font-weight=\"500\" fill=\"var(--ink)\" text-anchor=\"end\" opacity=\"0\">\n          Productivity ↗ +2%\n        <\u002Ftext>\n\n        <!-- Investment (steep) -->\n        <path id=\"invest-line\" d=\"M 60 250 C 220 240, 380 200, 540 130 S 700 70, 860 50\" stroke=\"var(--vermilion)\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"2000\" stroke-dashoffset=\"2000\"><\u002Fpath>\n        <text id=\"invest-label\" x=\"852\" y=\"36\" font-family=\"Space Grotesk\" font-size=\"13\" font-weight=\"500\" fill=\"var(--vermilion)\" text-anchor=\"end\" opacity=\"0\">\n          AI capex ↗ $200B\n        <\u002Ftext>\n\n        <!-- Gap shading -->\n        <path id=\"gap-shade\" d=\"M 540 130 L 540 246 L 860 244 L 860 50 Z\" fill=\"var(--vermilion)\" opacity=\"0\"><\u002Fpath>\n        <text id=\"gap-label\" x=\"700\" y=\"190\" font-family=\"Spectral\" font-style=\"italic\" font-size=\"18\" fill=\"var(--vermilion)\" text-anchor=\"middle\" opacity=\"0\">\n          The paradox\n        <\u002Ftext>\n      <\u002Fsvg>\n      <div class=\"legend\">\n        <div><span class=\"swatch\" style=\"background:var(--vermilion)\"><\u002Fspan>Global AI infrastructure investment<\u002Fdiv>\n        <div><span class=\"swatch\" style=\"background:var(--ink)\"><\u002Fspan>Aggregate labour productivity<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\" style=\"margin-top: 80px;\">\n      <p class=\"pull reveal\">\"Evangelism is meeting evaluation. The economy is asking AI to show its receipts.\"<\u002Fp>\n      <p class=\"body reveal\">The optimistic reading is that we are simply early. Productivity from general-purpose technologies — electricity, computing — has always lagged adoption by a decade or more. The pessimistic reading is structural: that something about <em>how<\u002Fem> organisations are deploying AI is creating its own friction. The next five chapters argue the pessimists are at least half right.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────────────────────────── CH 2 ───────────────────────────── -->\n<section class=\"chapter\" id=\"ch2\">\n  <div class=\"container\">\n    <div class=\"chapter-head\">\n      <div class=\"chapter-num reveal\">Chapter<strong>Two<\u002Fstrong><\u002Fdiv>\n      <div class=\"chapter-title\">\n        <h2 class=\"reveal delay-1\">The friction of <em>abundance.<\u002Fem><\u002Fh2>\n        <p class=\"standfirst reveal delay-2\">When generation becomes free, verification becomes expensive. The first source of the paradox is not what AI can't do — it is the administrative debt created by what it can.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">A predictable thing happens when you give every knowledge worker a tool that can produce a passable draft in eight seconds. The volume of drafts goes up. So does the volume of <em>nearly-right<\u002Fem> drafts: documents that read fluently, cite plausibly, and contain a quiet logic error in paragraph four.<\u002Fp>\n      <p class=\"body reveal\">Researchers have started calling the output <strong>workslop<\u002Fstrong> — content that is technically correct but contextually thin. The economic effect is that labour does not disappear. It migrates. It moves from the keyboard to the red pen.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"wide friction-grid\">\n      <div class=\"friction-cell reveal\">\n        <div class=\"tag\">Effect 01<\u002Fdiv>\n        <h3>The Verification Tax<\u002Fh3>\n        <p>Senior staff now spend more time fact-checking AI output than they would have spent producing it themselves. Generation became free; auditing became the bottleneck.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"friction-cell reveal delay-1\">\n        <div class=\"tag\">Effect 02<\u002Fdiv>\n        <div class=\"stat\">+12<span class=\"unit\">%<\u002Fspan><\u002Fdiv>\n        <h3>Automation bias<\u002Fh3>\n        <p>Commission errors — accepting an AI suggestion that is wrong — have risen as users habituate to plausible-sounding answers.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"friction-cell reveal delay-2\">\n        <div class=\"tag\">Effect 03<\u002Fdiv>\n        <h3>Shadow work<\u002Fh3>\n        <p>An invisible, unbudgeted layer of human labour fixes, filters and reformats AI output before it reaches its destination. None of it shows up on a roadmap.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"friction-cell reveal delay-3\">\n        <div class=\"tag\">Effect 04<\u002Fdiv>\n        <h3>The Red Queen's race<\u002Fh3>\n        <p>AI generates more noise; more AI is needed to manage the noise; the organisation runs faster to stay in the same place. The gains cancel.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow vtax reveal\">\n      <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px;\">Figure 2.1 · Where a knowledge worker's hour goes<\u002Fdiv>\n      <div class=\"vtax-bars\">\n        <div class=\"label\">2019<\u002Fdiv>\n        <div class=\"vtax-track\">\n          <div class=\"seg creation\" data-target=\"78\">Creation 78%<\u002Fdiv>\n          <div class=\"seg verify\" data-target=\"14\">Review 14%<\u002Fdiv>\n          <div class=\"seg fix\" data-target=\"8\">Fix 8%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vtax-bars\">\n        <div class=\"label\">2026<\u002Fdiv>\n        <div class=\"vtax-track\">\n          <div class=\"seg creation\" data-target=\"32\">Creation 32%<\u002Fdiv>\n          <div class=\"seg verify\" data-target=\"41\">Verification 41%<\u002Fdiv>\n          <div class=\"seg fix\" data-target=\"27\">Fixing slop 27%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: var(--serif); font-size: 14px; color: var(--muted); margin-top: 18px; max-width: 60ch;\">Drag-illustrative; based on time-use surveys of knowledge workers at firms reporting \"high\" AI tooling adoption.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">None of this is an argument against AI. It is an argument against pretending that bolting a generation engine onto a pre-AI workflow is the same thing as redesigning the workflow. The next chapter shows what happens when you don't.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────────────────────────── CH 3 ───────────────────────────── -->\n<section class=\"chapter\" id=\"ch3\">\n  <div class=\"container\">\n    <div class=\"chapter-head\">\n      <div class=\"chapter-num reveal\">Chapter<strong>Three<\u002Fstrong><\u002Fdiv>\n      <div class=\"chapter-title\">\n        <h2 class=\"reveal delay-1\">The agility edge: ninety-five percent <em>fail.<\u002Fem><\u002Fh2>\n        <p class=\"standfirst reveal delay-2\">The paradox is not universal. It correlates almost perfectly with size. Large enterprises are stuck in pilot purgatory while small firms quietly out-execute them.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">A recurring statistic from 2025 enterprise studies: roughly <strong>ninety-five percent<\u002Fstrong> of generative AI pilots at large companies fail to materially affect the bottom line. Not because the models are bad. Because the surrounding workflows are brittle, the approval chains are long, and the tooling is bolted onto software designed for human use a decade ago.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"wide pilot-purgatory\">\n      <div class=\"ratio-viz reveal\">\n        <svg viewBox=\"0 0 200 200\" id=\"ratio-svg\">\n          <!-- Generated by JS -->\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"ratio-text reveal delay-1\">\n        <h3>95<em>%<\u002Fem><\u002Fh3>\n        <p style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vermilion); margin-bottom: 16px;\">of enterprise GenAI pilots<\u002Fp>\n        <p>fail to make it to the bottom line. Each red square below is a pilot. The handful of grey ones are the ones that returned measurable EBIT impact within 18 months.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">Smaller firms have a structural advantage that does not show up on a balance sheet. They have fewer approval chains. Their leadership uses the tools. Their workflows are not yet calcified into legacy software. And so they pay no <em>coordination tax<\u002Fem> when adopting an agentic system — the cost a large organisation incurs from internal bureaucracy and siloed communication, which AI tooling cannot penetrate when it is bolted on the side.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"wide jcurve-figure reveal\" id=\"jcurve-figure\">\n      <div class=\"fig-label\">Figure 3.1 · Productivity ROI by firm size, 24-month curve<\u002Fdiv>\n      <div class=\"fig-title\">Small firms skip the J-curve dip entirely.<\u002Fdiv>\n      <svg viewBox=\"0 0 900 380\" id=\"jcurve-svg\" preserveAspectRatio=\"xMidYMid meet\">\n        <!-- grid -->\n        <g stroke=\"var(--rule)\" stroke-width=\"1\">\n          <line x1=\"60\" y1=\"40\" x2=\"860\" y2=\"40\"><\u002Fline>\n          <line x1=\"60\" y1=\"125\" x2=\"860\" y2=\"125\"><\u002Fline>\n          <line x1=\"60\" y1=\"210\" x2=\"860\" y2=\"210\" stroke=\"var(--rule-strong)\"><\u002Fline>\n          <line x1=\"60\" y1=\"295\" x2=\"860\" y2=\"295\"><\u002Fline>\n          <line x1=\"60\" y1=\"340\" x2=\"860\" y2=\"340\" stroke=\"var(--ink)\" stroke-width=\"1.2\"><\u002Fline>\n        <\u002Fg>\n        <g font-family=\"JetBrains Mono\" font-size=\"11\" fill=\"var(--muted)\">\n          <text x=\"50\" y=\"44\" text-anchor=\"end\">+10%<\u002Ftext>\n          <text x=\"50\" y=\"129\" text-anchor=\"end\">+5%<\u002Ftext>\n          <text x=\"50\" y=\"214\" text-anchor=\"end\">0<\u002Ftext>\n          <text x=\"50\" y=\"299\" text-anchor=\"end\">−5%<\u002Ftext>\n          <text x=\"64\" y=\"360\">M0<\u002Ftext>\n          <text x=\"220\" y=\"360\">M6<\u002Ftext>\n          <text x=\"380\" y=\"360\">M12<\u002Ftext>\n          <text x=\"540\" y=\"360\">M18<\u002Ftext>\n          <text x=\"700\" y=\"360\">M24<\u002Ftext>\n        <\u002Fg>\n\n        <!-- Enterprise J-curve -->\n        <path id=\"ent-line\" d=\"M 60 210 C 180 240, 280 285, 380 290 S 540 240, 700 215 S 860 195, 860 195\" stroke=\"var(--vermilion)\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"2000\" stroke-dashoffset=\"2000\"><\u002Fpath>\n        <text id=\"ent-label\" x=\"852\" y=\"183\" font-family=\"Space Grotesk\" font-size=\"13\" font-weight=\"500\" fill=\"var(--vermilion)\" text-anchor=\"end\" opacity=\"0\">\n          Enterprise (1k+ employees)\n        <\u002Ftext>\n\n        <!-- SMB curve -->\n        <path id=\"smb-line\" d=\"M 60 210 C 220 192, 380 160, 540 120 S 700 75, 860 60\" stroke=\"var(--teal)\" stroke-width=\"2.5\" fill=\"none\" stroke-dasharray=\"2000\" stroke-dashoffset=\"2000\"><\u002Fpath>\n        <text id=\"smb-label\" x=\"852\" y=\"48\" font-family=\"Space Grotesk\" font-size=\"13\" font-weight=\"500\" fill=\"var(--teal)\" text-anchor=\"end\" opacity=\"0\">\n          SMB ($1M–$10M)\n        <\u002Ftext>\n\n        <!-- Dip annotation -->\n        <text id=\"dip-anno\" x=\"380\" y=\"316\" font-family=\"Spectral\" font-style=\"italic\" font-size=\"14\" fill=\"var(--vermilion)\" text-anchor=\"middle\" opacity=\"0\">\n          Pilot purgatory\n        <\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div class=\"narrow\" style=\"margin-top: 64px;\">\n      <p class=\"pull reveal\">\"While Hyperscalers are still negotiating zero percent ROI, agile teams are quietly compounding.\"<\u002Fp>\n      <p class=\"body reveal\">These small firms are the prototype of what the literature now calls <strong>frontier firms<\u002Fstrong> — hybrid teams of humans and AI agents working seamlessly, with decisions made laterally rather than escalated. They are not winning because their AI is better. They are winning because their <em>org<\u002Fem> is.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────────────────────────── CH 4 — TOGGLE ───────────────────────────── -->\n<section class=\"chapter\" id=\"ch4\">\n  <div class=\"container\">\n    <div class=\"chapter-head\">\n      <div class=\"chapter-num reveal\">Chapter<strong>Four<\u002Fstrong><\u002Fdiv>\n      <div class=\"chapter-title\">\n        <h2 class=\"reveal delay-1\">Bolted on, or <span class=\"teal\">built in.<\u002Fspan><\u002Fh2>\n        <p class=\"standfirst reveal delay-2\">The deepest version of the paradox is architectural. Most organisations are still <em>Redwoods<\u002Fem> — tall, hierarchical, brittle. The firms beating the productivity gap have rebuilt themselves as <em>Mycelial Networks.<\u002Fem><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">A redwood is impressive. It is also a single point of failure. Every piece of information in a redwood organisation must travel up a trunk and back down a different branch — slowly, and with each handoff, more brittle. AI bolted onto this structure speeds up individual nodes. It does not change the topology.<\u002Fp>\n      <p class=\"body reveal\">A mycelial network is the opposite. It is a flat, decentralised mesh of human and agent nodes connecting to each other directly, with information routed by relevance rather than rank. The same supply-chain alert that takes six approvals in a redwood gets resolved in ten minutes in a mycelial network.<\u002Fp>\n      <p class=\"body reveal\" style=\"font-family: var(--mono); font-size: 14px; color: var(--muted);\">↓ Use the toggle to flip the same firm between the two architectures.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"wide toggle-stage\" id=\"toggle-stage\">\n      <div class=\"toggle-control\">\n        <button data-mode=\"redwood\" class=\"active\">Redwood · Bolted-on<\u002Fbutton>\n        <button data-mode=\"mycelial\">Mycelial · Built-in<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"stage-frame\">\n        <div class=\"stage-head\">\n          <div>\n            <div class=\"meta\">Figure 4.1 · Information topology<\u002Fdiv>\n            <h3 id=\"stage-title\">The <em>Redwood<\u002Fem> hierarchy<\u002Fh3>\n          <\u002Fdiv>\n          <div class=\"meta\" id=\"stage-mode\">Mode · Bolted-on<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"stage-svg\">\n          <svg viewBox=\"0 0 1000 460\" id=\"network-svg\" preserveAspectRatio=\"xMidYMid meet\"><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"annot\">\n          <div class=\"item\">\n            <div class=\"k\">Decisions<\u002Fdiv>\n            <div class=\"v\" id=\"annot-decisions\">Centralised · slow<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"item\">\n            <div class=\"k\">Information flow<\u002Fdiv>\n            <div class=\"v\" id=\"annot-flow\">Up the trunk, down branches<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"item\">\n            <div class=\"k\">Coordination tax<\u002Fdiv>\n            <div class=\"v\" id=\"annot-tax\">High<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">In the mycelial firm, work is performed not by static apps — Word, Outlook, an inbox — but by <strong>agentic workflows<\u002Fstrong>: coordinated teams of AI agents that independently plan and execute multi-step tasks, surfacing humans only when judgment is required. Decision efficiency, in firms that have made this shift, rises measurably — by twenty-three percent in published case data.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────────────────────────── CH 5 — EPOCH + Sarah ───────────────────────────── -->\n<section class=\"chapter\" id=\"ch5\">\n  <div class=\"container\">\n    <div class=\"chapter-head\">\n      <div class=\"chapter-num reveal\">Chapter<strong>Five<\u002Fstrong><\u002Fdiv>\n      <div class=\"chapter-title\">\n        <h2 class=\"reveal delay-1\">The work humans <em>keep.<\u002Fem><\u002Fh2>\n        <p class=\"standfirst reveal delay-2\">If agents handle execution, what is left? The EPOCH framework is the emerging answer: a sorting rule for which work stays with people and which gets handed to the network.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">The framework names five qualities of work that resist automation — qualities for which \"the model produced a passable answer\" is not the same as \"a human produced an accountable one.\" Hover over each letter to see what it captures.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"wide epoch-stage\">\n      <div class=\"epoch-svg-wrap reveal\">\n        <svg viewBox=\"-260 -260 520 520\" id=\"epoch-svg\">\n          <!-- pentagon + petals injected by JS -->\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"epoch-letters reveal delay-1\" id=\"epoch-letters\">\n        <div class=\"letter-row\" data-i=\"0\">\n          <div class=\"L\">E<\u002Fdiv>\n          <div><div class=\"name\">Empathy<\u002Fdiv><div class=\"desc\">Reading what a person actually means, not what they typed.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"letter-row\" data-i=\"1\">\n          <div class=\"L\">P<\u002Fdiv>\n          <div><div class=\"name\">Presence<\u002Fdiv><div class=\"desc\">Being in the room, with weight, when the call is hard.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"letter-row\" data-i=\"2\">\n          <div class=\"L\">O<\u002Fdiv>\n          <div><div class=\"name\">Opinion<\u002Fdiv><div class=\"desc\">Owning a stance — and the consequences of being wrong.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"letter-row\" data-i=\"3\">\n          <div class=\"L\">C<\u002Fdiv>\n          <div><div class=\"name\">Creativity<\u002Fdiv><div class=\"desc\">Finding the angle no model has been trained on.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"letter-row\" data-i=\"4\">\n          <div class=\"L\">H<\u002Fdiv>\n          <div><div class=\"name\">Hope<\u002Fdiv><div class=\"desc\">Holding belief in a direction long enough to make it real.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Sarah's day -->\n    <div class=\"day-stage\">\n      <div class=\"day-intro reveal\">\n        <div class=\"who\">A day in the life<\u002Fdiv>\n        <p class=\"name\">Sarah, <em>Strategy Architect<\u002Fem> at AgileFlow — a $5M frontier firm that has bypassed the paradox.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"day-timeline\">\n        <div class=\"day-row reveal\">\n          <div class=\"time\">08:30 <span class=\"ampm\">Morning<\u002Fspan><\u002Fdiv>\n          <div class=\"body\">\n            <h4>Navigating the verification tax.<\u002Fh4>\n            <p>Sarah opens her Fluid Canvas. Her entry agent has already collapsed 200 overnight data points into three priority actions, and drafted a client proposal. The draft is fluent and bland — <em>workslop<\u002Fem>. She spends thirty minutes on shadow work, fixing logic errors and adding context the model did not have. The crafted edits are what the client is paying for.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"concept\">Concept<span class=\"c-item\">Verification Tax · Shadow Work<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"day-row reveal\">\n          <div class=\"time\">10:30 <span class=\"ampm\">Mid-morning<\u002Fspan><\u002Fdiv>\n          <div class=\"body\">\n            <h4>Orchestrating the mycelial network.<\u002Fh4>\n            <p>A supply-chain disruption hits. In a redwood firm Sarah would now spend hours waiting for cross-functional approvals. Instead she triggers an agentic workflow: agents query warehouse data, negotiate with backup suppliers, update logistics — without a single internal meeting. Decisions land 23% faster than at her enterprise competitors.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"concept\">Concept<span class=\"c-item\">Mycelial Network · Coordination Tax<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"day-row reveal\">\n          <div class=\"time\">13:00 <span class=\"ampm\">Afternoon<\u002Fspan><\u002Fdiv>\n          <div class=\"body\">\n            <h4>Applying the EPOCH framework.<\u002Fh4>\n            <p>Deep work on a market expansion strategy. Boilerplate research and data modelling go to the agents — these are low-EPOCH tasks. Sarah focuses where humans still hold the edge: <em>Opinion<\u002Fem> on the strategic call, <em>Creativity<\u002Fem> in finding an angle the model can't see, <em>Empathy<\u002Fem> in reading the client's underlying fears. The machine provides scale; she provides soul.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"concept\">Concept<span class=\"c-item\">Hybrid Intelligence<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"day-row reveal\">\n          <div class=\"time\">15:30 <span class=\"ampm\">Late afternoon<\u002Fspan><\u002Fdiv>\n          <div class=\"body\">\n            <h4>Measuring the outcome era.<\u002Fh4>\n            <p>Before wrapping her 32-hour week, Sarah checks the dashboard. AgileFlow does not track \"time saved.\" It tracks EBIT impact from AI-led projects, the volume of new ideas in the innovation pipeline, and the skill proficiency of her team. While hyperscalers report 0% ROI, her firm has booked a measurable 5% profitability boost this quarter.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"concept\">Concept<span class=\"c-item\">Outcome-Era Metrics<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────────────────────────── CH 6 — Outcome era ───────────────────────────── -->\n<section class=\"chapter\" id=\"ch6\">\n  <div class=\"container\">\n    <div class=\"chapter-head\">\n      <div class=\"chapter-num reveal\">Chapter<strong>Six<\u002Fstrong><\u002Fdiv>\n      <div class=\"chapter-title\">\n        <h2 class=\"reveal delay-1\">From time saved to <em>outcome value.<\u002Fem><\u002Fh2>\n        <p class=\"standfirst reveal delay-2\">Every organisation that is still trapped in the paradox tracks the wrong metric. They count hours that didn't happen. The firms that have escaped count something else.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\">\n      <p class=\"body reveal\">\"Time saved\" is a flattering number. It is also a leaky one — saved hours are easily reabsorbed into more meetings, more drafts, more verification. Without a downstream metric attached to a real outcome, the savings evaporate before they reach the income statement. The shift the literature now calls <strong>the Outcome Era<\u002Fstrong> replaces the time question entirely.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"wide outcome-stage reveal\">\n      <div class=\"outcome-col old\">\n        <div class=\"header\">The trap · what most firms still measure<\u002Fdiv>\n        <h3>The <em>time-saved<\u002Fem> era.<\u002Fh3>\n        <ul>\n          <li>Hours per task, before and after.<\u002Fli>\n          <li>Number of pilots launched.<\u002Fli>\n          <li>Software seats activated.<\u002Fli>\n          <li>Tickets closed by an agent.<\u002Fli>\n          <li>\"Productivity scores\" from internal surveys.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"outcome-col new\">\n        <div class=\"header\">The escape · what frontier firms measure<\u002Fdiv>\n        <h3>The <em>outcome<\u002Fem> era.<\u002Fh3>\n        <ul>\n          <li>EBIT impact attributable to AI-led work.<\u002Fli>\n          <li>Innovation pipeline volume — net new ideas shipped.<\u002Fli>\n          <li>Skill proficiency of the human team.<\u002Fli>\n          <li>Decision latency: alert to action.<\u002Fli>\n          <li>The \"Five-Hour Rule\": coaching hours per employee.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"narrow\" style=\"margin-top: 64px;\">\n      <p class=\"body reveal\">The historical analogy that matters is not the personal computer. It is electrification. Factories did not become more productive when they swapped the steam engine for an electric motor; the output curve barely moved. They became more productive a generation later, when someone reorganised the factory floor around what electricity made possible — the assembly line. The motor was the easy part. The architecture was the hard part.<\u002Fp>\n      <p class=\"body reveal\">AI in 2026 is at the motor stage. The organisations that will still matter in 2036 are the ones quietly inventing the assembly line.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────────────────────────── CLOSING ───────────────────────────── -->\n<section class=\"closing\">\n  <div class=\"container\">\n    <div class=\"narrow\">\n      <p class=\"punch reveal\">The paradox is not that AI <em>doesn't work.<\u002Fem> It is that most organisations <em>haven't.<\u002Fem><\u002Fp>\n      <div class=\"signoff reveal\">\n        <div>Filed<strong>April 2026<\u002Fstrong><\u002Fdiv>\n        <div>Reading<strong>≈ 11 minutes<\u002Fstrong><\u002Fdiv>\n        <div>Next<strong>—<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <footer class=\"foot container\">\n    <div>The AI Paradox · An interactive essay<\u002Fdiv>\n    <div>End of document<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fsection>\n\n<script>\n/* ─────────────────────────────────────────────────────\n   1. Reveal-on-scroll\n   ───────────────────────────────────────────────────── */\nconst io = new IntersectionObserver((entries) => {\n  entries.forEach(e => {\n    if (e.isIntersecting) {\n      e.target.classList.add('in');\n      io.unobserve(e.target);\n    }\n  });\n}, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\ndocument.querySelectorAll('.reveal').forEach(el => io.observe(el));\n\n/* ─────────────────────────────────────────────────────\n   2. Progress bar\n   ───────────────────────────────────────────────────── */\nconst progress = document.getElementById('progress');\nfunction updateProgress(){\n  const h = document.documentElement.scrollHeight - window.innerHeight;\n  const p = Math.min(100, (window.scrollY / h) * 100);\n  progress.style.width = p + '%';\n}\nwindow.addEventListener('scroll', updateProgress, { passive: true });\nupdateProgress();\n\n/* ─────────────────────────────────────────────────────\n   3. Chapter 1: animate gap chart in view\n   ───────────────────────────────────────────────────── */\nconst gapFig = document.getElementById('gap-figure');\nconst gapIO = new IntersectionObserver((es)=> {\n  es.forEach(e => {\n    if (!e.isIntersecting) return;\n    const prod = document.getElementById('prod-line');\n    const inv  = document.getElementById('invest-line');\n    const prodLen = prod.getTotalLength();\n    const invLen  = inv.getTotalLength();\n    prod.style.strokeDasharray = prodLen;\n    prod.style.strokeDashoffset = prodLen;\n    inv.style.strokeDasharray = invLen;\n    inv.style.strokeDashoffset = invLen;\n    prod.getBoundingClientRect(); // reflow\n    prod.style.transition = 'stroke-dashoffset 1.6s ease-out 0.2s';\n    inv.style.transition  = 'stroke-dashoffset 2.0s ease-out 0.4s';\n    requestAnimationFrame(()=> {\n      prod.style.strokeDashoffset = 0;\n      inv.style.strokeDashoffset = 0;\n    });\n    setTimeout(() => {\n      document.getElementById('prod-label').style.transition = 'opacity 0.6s';\n      document.getElementById('prod-label').style.opacity = 1;\n      document.getElementById('invest-label').style.transition = 'opacity 0.6s';\n      document.getElementById('invest-label').style.opacity = 1;\n    }, 1600);\n    setTimeout(() => {\n      const sh = document.getElementById('gap-shade');\n      sh.style.transition = 'opacity 1.2s';\n      sh.style.opacity = 0.10;\n      const lbl = document.getElementById('gap-label');\n      lbl.style.transition = 'opacity 0.8s';\n      lbl.style.opacity = 1;\n    }, 2400);\n    gapIO.disconnect();\n  });\n}, { threshold: 0.4 });\ngapIO.observe(gapFig);\n\n/* ─────────────────────────────────────────────────────\n   4. Chapter 2: verification-tax bars animate in\n   ───────────────────────────────────────────────────── */\nconst vtaxIO = new IntersectionObserver((es) => {\n  es.forEach(e => {\n    if (!e.isIntersecting) return;\n    document.querySelectorAll('.vtax-track').forEach(track => {\n      const segs = track.querySelectorAll('.seg');\n      segs.forEach((s, i) => {\n        setTimeout(() => {\n          s.style.width = s.dataset.target + '%';\n        }, 200 + i * 150);\n      });\n    });\n    vtaxIO.disconnect();\n  });\n}, { threshold: 0.5 });\nconst vtaxEl = document.querySelector('.vtax');\nif (vtaxEl) vtaxIO.observe(vtaxEl);\n\n/* ─────────────────────────────────────────────────────\n   5. Chapter 3: 95% pilot purgatory dot grid + J-curve\n   ───────────────────────────────────────────────────── */\nfunction renderRatio() {\n  const svg = document.getElementById('ratio-svg');\n  if (!svg) return;\n  const rows = 10, cols = 10;\n  const cell = 20, pad = 0;\n  let html = '';\n  let count = 0;\n  // 95 red, 5 dark\n  const successIdx = new Set([7, 23, 41, 68, 89]); // 5 success indices\n  for (let r = 0; r < rows; r++) {\n    for (let c = 0; c < cols; c++) {\n      const x = c * cell + pad;\n      const y = r * cell + pad;\n      const isFail = !successIdx.has(count);\n      const fill = isFail ? 'var(--vermilion)' : 'var(--ink)';\n      const opacity = isFail ? 0.85 : 1;\n      html += `<rect x=\"${x+2}\" y=\"${y+2}\" width=\"${cell-4}\" height=\"${cell-4}\"\n                fill=\"${fill}\" opacity=\"0\" data-i=\"${count}\"\n                style=\"transition: opacity 0.4s ease ${count*8}ms\"/>`;\n      count++;\n    }\n  }\n  svg.innerHTML = html;\n  // Animate when in view\n  const rio = new IntersectionObserver((es) => {\n    es.forEach(e => {\n      if (!e.isIntersecting) return;\n      svg.querySelectorAll('rect').forEach(r => {\n        r.style.opacity = r.getAttribute('opacity') ?? 1;\n      });\n      // Force opacity from fill rule above\n      svg.querySelectorAll('rect').forEach(r => {\n        const isSuccess = successIdx.has(+r.dataset.i);\n        r.style.opacity = isSuccess ? 1 : 0.85;\n      });\n      rio.disconnect();\n    });\n  }, { threshold: 0.4 });\n  rio.observe(svg);\n}\nrenderRatio();\n\nconst jcurveIO = new IntersectionObserver((es) => {\n  es.forEach(e => {\n    if (!e.isIntersecting) return;\n    const ent = document.getElementById('ent-line');\n    const smb = document.getElementById('smb-line');\n    [ent, smb].forEach((p, i) => {\n      const len = p.getTotalLength();\n      p.style.strokeDasharray = len;\n      p.style.strokeDashoffset = len;\n      p.getBoundingClientRect();\n      p.style.transition = `stroke-dashoffset 1.8s ease-out ${i * 0.3}s`;\n      requestAnimationFrame(()=> p.style.strokeDashoffset = 0);\n    });\n    setTimeout(() => {\n      document.getElementById('ent-label').style.transition = 'opacity 0.6s';\n      document.getElementById('ent-label').style.opacity = 1;\n      document.getElementById('smb-label').style.transition = 'opacity 0.6s';\n      document.getElementById('smb-label').style.opacity = 1;\n      document.getElementById('dip-anno').style.transition = 'opacity 0.8s';\n      document.getElementById('dip-anno').style.opacity = 1;\n    }, 1500);\n    jcurveIO.disconnect();\n  });\n}, { threshold: 0.4 });\nconst jc = document.getElementById('jcurve-figure');\nif (jc) jcurveIO.observe(jc);\n\n/* ─────────────────────────────────────────────────────\n   6. Chapter 4: Redwood ↔ Mycelial network toggle\n   ───────────────────────────────────────────────────── */\nconst networkSvg = document.getElementById('network-svg');\n\n// 13 nodes total — used by both layouts\n// Redwood: tree layout (CEO at top, 3 VPs, 9 ICs)\n// Mycelial: distributed force-style layout (precomputed)\n\nconst nodes = [\n  // CEO\n  { id: 'ceo',  label: 'CEO',  redwood: [500, 50],  mycel: [500, 230] },\n  // VPs\n  { id: 'vp1',  label: 'VP·OPS',  redwood: [220, 160], mycel: [260, 110] },\n  { id: 'vp2',  label: 'VP·ENG',  redwood: [500, 160], mycel: [740, 110] },\n  { id: 'vp3',  label: 'VP·GTM',  redwood: [780, 160], mycel: [400, 380] },\n  // Mid-managers\n  { id: 'm1',   label: 'MGR',  redwood: [110, 280], mycel: [120, 240] },\n  { id: 'm2',   label: 'MGR',  redwood: [330, 280], mycel: [620, 360] },\n  { id: 'm3',   label: 'MGR',  redwood: [500, 280], mycel: [880, 280] },\n  { id: 'm4',   label: 'MGR',  redwood: [670, 280], mycel: [180, 380] },\n  { id: 'm5',   label: 'MGR',  redwood: [890, 280], mycel: [820, 400] },\n  // Agents / ICs\n  { id: 'a1',   label: 'AGENT', redwood: [110, 400], mycel: [380, 90],  agent: true },\n  { id: 'a2',   label: 'AGENT', redwood: [330, 400], mycel: [600, 90],  agent: true },\n  { id: 'a3',   label: 'AGENT', redwood: [670, 400], mycel: [60, 320],  agent: true },\n  { id: 'a4',   label: 'AGENT', redwood: [890, 400], mycel: [940, 200], agent: true },\n];\n\nconst redwoodEdges = [\n  ['ceo','vp1'], ['ceo','vp2'], ['ceo','vp3'],\n  ['vp1','m1'], ['vp1','m2'],\n  ['vp2','m3'],\n  ['vp3','m4'], ['vp3','m5'],\n  ['m1','a1'], ['m2','a2'], ['m4','a3'], ['m5','a4'],\n];\n\nconst mycelialEdges = [\n  // CEO connects to a few, not all\n  ['ceo','vp1'],['ceo','vp2'],['ceo','vp3'],['ceo','m2'],\n  // peer-to-peer\n  ['vp1','vp2'],['vp1','m1'],['vp1','a1'],\n  ['vp2','m3'],['vp2','a2'],['vp2','a4'],\n  ['vp3','m2'],['vp3','m4'],['vp3','m5'],\n  ['m1','a1'],['m1','a3'],['m1','vp3'],\n  ['m2','a2'],['m2','m5'],\n  ['m3','a4'],['m3','a2'],\n  ['m4','a3'],['m4','m1'],\n  ['m5','a4'],['m5','vp1'],\n  ['a1','a3'],['a2','a4'],['a1','m2'],\n];\n\nfunction renderNetwork(mode) {\n  const edges = mode === 'redwood' ? redwoodEdges : mycelialEdges;\n  let svg = '';\n\n  // Edges first\n  const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));\n  edges.forEach((e, i) => {\n    const a = nodeMap[e[0]];\n    const b = nodeMap[e[1]];\n    const ax = a[mode === 'redwood' ? 'redwood' : 'mycel'][0];\n    const ay = a[mode === 'redwood' ? 'redwood' : 'mycel'][1];\n    const bx = b[mode === 'redwood' ? 'redwood' : 'mycel'][0];\n    const by = b[mode === 'redwood' ? 'redwood' : 'mycel'][1];\n    const op = mode === 'redwood' ? 0.55 : 0.32;\n    const stroke = mode === 'redwood' ? 'var(--ink)' : 'var(--teal)';\n    svg += `<line class=\"edge\" x1=\"${ax}\" y1=\"${ay}\" x2=\"${bx}\" y2=\"${by}\"\n              stroke=\"${stroke}\" stroke-opacity=\"${op}\"\n              stroke-width=\"${mode === 'redwood' ? 1.2 : 1}\"/>`;\n  });\n\n  // Nodes on top\n  nodes.forEach(n => {\n    const [x, y] = n[mode === 'redwood' ? 'redwood' : 'mycel'];\n    const isAgent = n.agent;\n    const isCeo = n.id === 'ceo';\n    const r = isCeo ? 26 : 19;\n    let fill, stroke;\n    if (mode === 'redwood') {\n      fill = isCeo ? 'var(--ink)' : (isAgent ? 'var(--paper)' : 'var(--paper-2)');\n      stroke = 'var(--ink)';\n    } else {\n      // Mycelial: more egalitarian\n      fill = isAgent ? 'var(--teal)' : 'var(--paper)';\n      stroke = 'var(--teal)';\n    }\n    const tcolor = (mode === 'redwood' && isCeo) || (mode === 'mycelial' && isAgent)\n      ? 'var(--paper)' : 'var(--ink)';\n    svg += `<g class=\"node\">\n      <circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"1.4\"/>\n      <text x=\"${x}\" y=\"${y+0.5}\" fill=\"${tcolor}\" font-size=\"${isCeo ? 10 : 9}\">${n.label}<\u002Ftext>\n    <\u002Fg>`;\n  });\n\n  networkSvg.innerHTML = svg;\n}\n\n// Initial render\nrenderNetwork('redwood');\n\n// Toggle wiring\nconst buttons = document.querySelectorAll('.toggle-control button');\nbuttons.forEach(b => {\n  b.addEventListener('click', () => {\n    buttons.forEach(x => x.classList.remove('active'));\n    b.classList.add('active');\n    const mode = b.dataset.mode;\n    renderNetwork(mode);\n    // update annotations\n    const title = document.getElementById('stage-title');\n    const modeLabel = document.getElementById('stage-mode');\n    const dec = document.getElementById('annot-decisions');\n    const flow = document.getElementById('annot-flow');\n    const tax = document.getElementById('annot-tax');\n    if (mode === 'redwood') {\n      title.innerHTML = 'The <em>Redwood<\u002Fem> hierarchy';\n      title.style.color = 'var(--ink)';\n      modeLabel.textContent = 'Mode · Bolted-on';\n      dec.textContent = 'Centralised · slow';\n      flow.textContent = 'Up the trunk, down branches';\n      tax.textContent = 'High';\n      tax.style.color = 'var(--vermilion)';\n    } else {\n      title.innerHTML = 'The <em style=\"color:var(--teal)\">Mycelial<\u002Fem> network';\n      title.style.color = 'var(--ink)';\n      modeLabel.textContent = 'Mode · Built-in';\n      dec.textContent = 'Decentralised · 23% faster';\n      flow.textContent = 'Lateral, by relevance';\n      tax.textContent = 'Near zero';\n      tax.style.color = 'var(--teal)';\n    }\n  });\n});\n\n/* ─────────────────────────────────────────────────────\n   7. EPOCH wheel\n   ───────────────────────────────────────────────────── */\nconst epochSvg = document.getElementById('epoch-svg');\nconst epochData = [\n  { L: 'E', name: 'Empathy' },\n  { L: 'P', name: 'Presence' },\n  { L: 'O', name: 'Opinion' },\n  { L: 'C', name: 'Creativity' },\n  { L: 'H', name: 'Hope' },\n];\nfunction renderEpoch(activeIdx = -1) {\n  const R = 200;          // outer\n  const r = 80;           // inner core\n  const N = 5;\n  let html = '';\n\n  // Outer ring decoration\n  html += `<circle cx=\"0\" cy=\"0\" r=\"${R+18}\" fill=\"none\" stroke=\"var(--rule)\" stroke-dasharray=\"2 6\"/>`;\n\n  for (let i = 0; i < N; i++) {\n    const a0 = (i / N) * Math.PI * 2 - Math.PI / 2 - Math.PI / N;\n    const a1 = ((i+1) / N) * Math.PI * 2 - Math.PI / 2 - Math.PI / N;\n    // Wedge from r to R\n    const x0o = Math.cos(a0) * R, y0o = Math.sin(a0) * R;\n    const x1o = Math.cos(a1) * R, y1o = Math.sin(a1) * R;\n    const x0i = Math.cos(a0) * r, y0i = Math.sin(a0) * r;\n    const x1i = Math.cos(a1) * r, y1i = Math.sin(a1) * r;\n    const isActive = i === activeIdx;\n    const fill = isActive ? 'var(--vermilion)' : 'var(--paper-2)';\n    const stroke = isActive ? 'var(--vermilion)' : 'var(--rule-strong)';\n    html += `<path d=\"\n      M ${x0i} ${y0i}\n      L ${x0o} ${y0o}\n      A ${R} ${R} 0 0 1 ${x1o} ${y1o}\n      L ${x1i} ${y1i}\n      A ${r} ${r} 0 0 0 ${x0i} ${y0i} Z\n    \" fill=\"${fill}\" stroke=\"${stroke}\" stroke-width=\"1\"\n       style=\"transition: fill 0.3s ease, stroke 0.3s ease;\"/>`;\n    // Letter label\n    const am = (a0 + a1) / 2;\n    const lx = Math.cos(am) * (R - 50);\n    const ly = Math.sin(am) * (R - 50);\n    const tcolor = isActive ? 'var(--paper)' : 'var(--ink)';\n    html += `<text x=\"${lx}\" y=\"${ly+18}\" font-family=\"Spectral\" font-style=\"italic\"\n              font-size=\"48\" font-weight=\"400\" text-anchor=\"middle\"\n              fill=\"${tcolor}\" style=\"transition: fill 0.3s ease;\">${epochData[i].L}<\u002Ftext>`;\n    const nx = Math.cos(am) * (R - 14);\n    const ny = Math.sin(am) * (R - 14);\n    html += `<text x=\"${nx}\" y=\"${ny+4}\" font-family=\"JetBrains Mono\"\n              font-size=\"9\" letter-spacing=\"2\" text-anchor=\"middle\"\n              fill=\"${isActive ? 'var(--paper)' : 'var(--muted)'}\"\n              style=\"transition: fill 0.3s ease; text-transform: uppercase;\">${epochData[i].name.toUpperCase()}<\u002Ftext>`;\n  }\n  // Center\n  html += `<circle cx=\"0\" cy=\"0\" r=\"${r}\" fill=\"var(--paper)\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/>`;\n  html += `<text x=\"0\" y=\"-6\" font-family=\"JetBrains Mono\" font-size=\"9\"\n            letter-spacing=\"2\" text-anchor=\"middle\" fill=\"var(--muted)\">HUMAN<\u002Ftext>`;\n  html += `<text x=\"0\" y=\"14\" font-family=\"Spectral\" font-style=\"italic\"\n            font-size=\"20\" text-anchor=\"middle\" fill=\"var(--ink)\">work<\u002Ftext>`;\n  epochSvg.innerHTML = html;\n}\nrenderEpoch(-1);\ndocument.querySelectorAll('.epoch-letters .letter-row').forEach(row => {\n  row.addEventListener('mouseenter', () => {\n    document.querySelectorAll('.epoch-letters .letter-row').forEach(r=>r.classList.remove('active'));\n    row.classList.add('active');\n    renderEpoch(+row.dataset.i);\n  });\n  row.addEventListener('mouseleave', () => {\n    row.classList.remove('active');\n    renderEpoch(-1);\n  });\n  row.addEventListener('click', () => {\n    document.querySelectorAll('.epoch-letters .letter-row').forEach(r=>r.classList.remove('active'));\n    row.classList.add('active');\n    renderEpoch(+row.dataset.i);\n  });\n});\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
